<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1440 공유 캘린더 초대</title>
<meta property="og:title" content="1440 공유 캘린더 초대">
<meta property="og:description" content="공유 캘린더에 초대받았어요. 눌러서 참여해 보세요.">
<style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#fafafa;color:#0a0a0a}
@media (prefers-color-scheme:dark){body{background:#000;color:#f5f5f7}.btn{background:#f5f5f7!important;color:#000!important}.ghost,.code{background:#1c1c1e!important;color:#f5f5f7!important}}
main{text-align:center;padding:24px;max-width:380px}h1{font-size:26px;margin:0 0 8px}p{color:#8e8e93;margin:6px 0}
.btn,.ghost{display:block;margin:12px 0;padding:15px;border-radius:999px;text-decoration:none;font-weight:600;border:0;width:100%;font-size:16px;cursor:pointer}
.btn{background:#0a0a0a;color:#fff;margin-top:24px}.ghost{background:#ececec;color:#0a0a0a}
.code{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:3px;background:#fff;border-radius:14px;padding:14px;margin-top:20px}
.step{font-size:14px;margin-top:20px}
</style></head>
<body><main>
<h1>공유 캘린더 초대</h1>
<p>1440 앱에서 열면 바로 참여할 수 있어요.</p>
<a class="btn" id="open" href="#">1440에서 열기</a>
<a class="ghost" id="store" href="#">앱 설치하기</a>
<p class="step">설치한 뒤 이 페이지에서 <b>1440에서 열기</b>를 다시 누르거나,<br>앱의 <b>더 보기 → 공유 캘린더</b>에서 아래 코드를 입력해 주세요.</p>
<div class="code" id="code">-</div>
<button class="ghost" id="copy">코드 복사</button>
</main>
<script>
var code=(new URLSearchParams(location.search).get('code')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,20);
document.getElementById('code').textContent=code||'-';
var ua=navigator.userAgent, android=/Android/i.test(ua);
var ios='https://apps.apple.com/app/id6818588612', play='https://play.google.com/store/apps/details?id=com.skyla2000.app1440';
var app='app1440://join/'+code;
// Android: an intent link opens the app, or Play when it isn't installed (no "invalid address" error).
var open=android ? 'intent://join/'+code+'#Intent;scheme=app1440;package=com.skyla2000.app1440;S.browser_fallback_url='+encodeURIComponent(play)+';end' : app;
document.getElementById('open').href=open;
document.getElementById('store').href=android?play:ios;
document.getElementById('copy').onclick=function(){
  var b=this;(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(function(){b.textContent='복사했어요'},function(){b.textContent='코드를 길게 눌러 복사해 주세요'});
};
// Android tries the app once automatically (falls back to Play). iOS waits for a tap:
// Safari shows an "invalid address" alert for a custom link when the app isn't installed.
if(code&&android){setTimeout(function(){location.href=open},350);}
</script>
</body></html>
