<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1440 캘린더 초대</title>
<meta property="og:title" content="1440 캘린더 초대">
<meta property="og:description" content="함께 쓰는 캘린더에 초대받았어요. 눌러서 참여해 보세요.">
<style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#fafafa;color:#0a0a0a}
@media (prefers-color-scheme:dark){body{background:#000;color:#f5f5f7}.btn{background:#f5f5f7!important;color:#000!important}.code{background:#1c1c1e!important}}
main{text-align:center;padding:24px;max-width:360px}h1{font-size:26px;margin:0 0 8px}p{color:#8e8e93;margin:6px 0}
.btn{display:block;margin:24px 0 12px;padding:16px;border-radius:999px;background:#0a0a0a;color:#fff;text-decoration:none;font-weight:600}
.code{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:3px;background:#fff;border-radius:14px;padding:14px;margin-top:16px}
</style></head>
<body><main>
<h1>함께 쓰는 캘린더 초대</h1>
<p>1440 앱에서 열면 바로 참여할 수 있어요.</p>
<a class="btn" id="open" href="#">1440에서 열기</a>
<p>앱이 안 열리면 1440을 설치한 뒤<br>더 보기 → 함께 쓰는 캘린더에 이 코드를 입력해 주세요.</p>
<div class="code" id="code">-</div>
</main>
<script>
var code=(new URLSearchParams(location.search).get('code')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,20);
document.getElementById('code').textContent=code||'-';
var link='app1440://join/'+code;
document.getElementById('open').href=link;
if(code){setTimeout(function(){location.href=link},300);}
</script>
</body></html>
